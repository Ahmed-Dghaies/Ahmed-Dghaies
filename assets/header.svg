<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ahmed Dghaies — Software Engineer terminal header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .name { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; letter-spacing: 4px; }
      .prompt { fill: #38bdf8; }
      .cmd { fill: #e2e8f0; }
      .out { fill: #64748b; }
      .val { fill: #a5b4fc; }
      .line { opacity: 0; animation: fade .35s ease forwards; }
      .l1 { animation-delay: .3s; } .l2 { animation-delay: .9s; }
      .l3 { animation-delay: 1.5s; } .l4 { animation-delay: 2.1s; }
      .l5 { animation-delay: 2.7s; }
      @keyframes fade { from { opacity: 0; transform: translateX(-6px);} to { opacity: 1; transform: translateX(0);} }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="319" rx="16" fill="url(#bg)" stroke="#1e293b"/>

  <!-- window chrome -->
  <g transform="translate(28,26)">
    <circle cx="0" cy="0" r="6" fill="#ef4444"/>
    <circle cx="22" cy="0" r="6" fill="#f59e0b"/>
    <circle cx="44" cy="0" r="6" fill="#22c55e"/>
    <text x="360" y="4" text-anchor="middle" class="mono" font-size="13" fill="#475569">ahmed@wintics: ~/dev</text>
  </g>
  <line x1="0" y1="52" x2="900" y2="52" stroke="#1e293b"/>

  <!-- big identity -->
  <text x="40" y="112" class="name" font-size="42" fill="#f8fafc">AHMED DGHAIES</text>
  <rect x="40" y="126" width="118" height="4" rx="2" fill="url(#accent)"/>
  <!-- terminal lines -->
  <g class="mono" font-size="16">
    <g class="line l1"><text x="40" y="168"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text></g>
    <g class="line l2"><text x="40" y="192"><tspan class="out">→ </tspan><tspan class="val">ahmed-dghaies</tspan></text></g>
    <g class="line l3"><text x="40" y="222"><tspan class="prompt">$ </tspan><tspan class="cmd">cat focus.txt</tspan></text></g>
    <g class="line l4"><text x="40" y="246"><tspan class="out">→ </tspan><tspan class="val">frontend · dashboards · data-viz · systems</tspan></text></g>
    <g class="line l5"><text x="40" y="284"><tspan class="prompt">$ </tspan><tspan class="cmd">status --now</tspan><tspan class="out">  → building things @ </tspan><tspan class="val">Wintics</tspan><tspan class="cursor" fill="#38bdf8"> █</tspan></text></g>
  </g>
</svg>
